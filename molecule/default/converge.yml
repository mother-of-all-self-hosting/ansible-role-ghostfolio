---
- name: Include roles for Ghostfolio Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for Ghostfolio Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-postgres
        - ansible-role-valkey
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Postgres systemd service is started
      ansible.builtin.systemd_service:
        name: postgres.service
        state: started

    - name: Ensure Valkey systemd service is started
      ansible.builtin.systemd_service:
        name: valkey.service
        state: started

    # `state: started` leaves an already-running service alone, so on a second
    # converge against the same instance it would keep running the previous
    # unit file and `verify.yml` would be probing something the role no longer
    # generates. The role works out whether anything it manages changed;
    # acting on that here is what a playbook's systemd service manager role
    # does, and it stays idempotent because an unchanged run computes `false`.
    #
    # One task rather than a start followed by a conditional restart: on a
    # first converge everything the role manages has just changed, so a
    # separate restart would tear the container down and make Ghostfolio run
    # its whole migration set a second time before it ever serves anything.
    # `restarted` starts a service that is not running, so this covers both.
    - name: Ensure Ghostfolio systemd service is started
      ansible.builtin.systemd_service:
        name: ghostfolio.service
        state: "{{ 'restarted' if ghostfolio_restart_necessary | bool else 'started' }}"
